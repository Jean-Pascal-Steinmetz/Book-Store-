<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DA Bookstore</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <link rel="shortcut icon" href="assets/icons/favicon-klein.png">
</head>
<body onload="renderBooks()">
    <header>
        <img src="./assets/icons/favicon-mittel.png" alt="Buch Logo">
        <h1>DA Bookstore - get your book here </h1>
    </header>

    <main>
        <div id="bookBox" class="allBooks"></div>
        <input type="text" name="Schreibe einen Kommentar">Schreibe einen Kommentar
        <button id="send-comment" onclick="addComment()"><img src="./assets/icons/send-icon.png" alt=""></button>

    </main>

    <footer>
        <img src="./assets/icons/da-logo.svg" alt="Developer Akademie Logo">
    </footer>
</body>
</html>
